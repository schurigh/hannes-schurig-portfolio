<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="50%" stop-color="#030914"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Emerald Matrix Green Gradient -->
    <linearGradient id="matrixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Cyber Shield / Chamfered Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="88" ry="88" fill="url(#cyberBg)" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" rx="76" ry="76" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Tactical Circuit Traces -->
  <g stroke="#00e5ff" stroke-opacity="0.25" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 60 120 L 120 120 L 150 90 L 260 90"/>
    <circle cx="260" cy="90" r="4" fill="#00e5ff" fill-opacity="0.5"/>

    <path d="M 452 392 L 392 392 L 362 422 L 252 422"/>
    <circle cx="252" cy="422" r="4" fill="#00e5ff" fill-opacity="0.5"/>
    
    <path d="M 452 140 L 400 140 L 370 170"/>
    <circle cx="370" cy="170" r="3.5" fill="#38bdf8" fill-opacity="0.5"/>
    
    <path d="M 60 372 L 112 372 L 142 342"/>
    <circle cx="142" cy="342" r="3.5" fill="#38bdf8" fill-opacity="0.5"/>
  </g>

  <!-- Corner Brackets (HUD Reticle Frame) -->
  <g stroke="#00e5ff" stroke-width="6" stroke-linecap="square" fill="none" filter="url(#subtleGlow)">
    <path d="M 64 100 L 64 64 L 100 64"/>
    <path d="M 448 100 L 448 64 L 412 64"/>
    <path d="M 64 412 L 64 448 L 100 448"/>
    <path d="M 448 412 L 448 448 L 412 448"/>
  </g>

  <!-- High-Tech Central Terminal Glyph: '>' Prompt -->
  <g filter="url(#neonGlow)">
    <!-- Cyan Command Chevron '>' -->
    <path d="M 128 160 L 246 256 L 128 352 L 168 376 L 312 256 L 168 136 Z" 
          fill="url(#cyanNeon)" />
    <!-- Chevron Bevel Accent Highlight -->
    <path d="M 168 136 L 312 256 L 168 376 L 192 376 L 328 256 L 192 136 Z" 
          fill="#e0f2fe" fill-opacity="0.8"/>
  </g>

  <!-- Glowing Matrix Green / Cyan Terminal Cursor Block '_' -->
  <g filter="url(#neonGlow)">
    <!-- Underscore / Block Cursor -->
    <rect x="330" y="324" width="76" height="34" rx="6" ry="6" fill="url(#matrixGreen)"/>
    <rect x="332" y="326" width="72" height="12" rx="3" ry="3" fill="#a7f3d0" fill-opacity="0.6"/>
  </g>

  <!-- Cyber Sub-Label Code Dots -->
  <circle cx="340" cy="190" r="5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="366" cy="190" r="5" fill="#00e5ff" opacity="0.5"/>
  <circle cx="392" cy="190" r="5" fill="#00e5ff" opacity="0.25"/>
</svg>
