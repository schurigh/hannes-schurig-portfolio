<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#cyber-grad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="#00e5ff" stroke-width="2"/>
  
  <!-- Center HUD circle & Tech elements -->
  <circle cx="400" cy="225" r="110" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
  <circle cx="400" cy="225" r="80" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="10, 6"/>
  <circle cx="400" cy="225" r="50" fill="rgba(0, 229, 255, 0.05)" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1"/>
  
  <line x1="400" y1="95" x2="400" y2="355" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1"/>
  <line x1="270" y1="225" x2="530" y2="225" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1"/>
  
  <!-- System Labels -->
  <text x="50" y="70" fill="#00e5ff" font-family="'Oxanium', monospace" font-size="14" letter-spacing="2">SEC//IMG: TELEMETRY_CAPTURE</text>
  <text x="750" y="70" text-anchor="end" fill="#ffb703" font-family="'Oxanium', monospace" font-size="12" letter-spacing="1">STATUS: ENCRYPTED // 256-BIT</text>
  
  <!-- Center Text -->
  <text x="400" y="220" text-anchor="middle" fill="#ffffff" font-family="'Oxanium', monospace" font-size="20" font-weight="bold" letter-spacing="3">PROJECT TELEMETRY</text>
  <text x="400" y="245" text-anchor="middle" fill="#00e5ff" font-family="'Oxanium', monospace" font-size="13" letter-spacing="2">[ PREVIEW BUFFER ]</text>
</svg>
